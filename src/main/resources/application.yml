server:
  port: 8080
  netty:
    connection-timeout: 30000
    idle-timeout: 60000
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain
    min-response-size: 1024

spring:
  application:
    name: community-api-gateway
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── Redis ──────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000

  # ── Security ───────────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/mana-community}

  # ── Spring Cloud Gateway ───────────────────────────────────────────
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
            allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowed-headers: "*"
            exposed-headers: X-Correlation-Id,X-Request-Id,X-RateLimit-Remaining,X-RateLimit-Limit,X-RateLimit-Reset
            allow-credentials: true
            max-age: 3600

      routes:
        # ── Identity / Auth Service ──────────────────────────────────
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://identity-service:8080}
          predicates:
            - Path=/api/v1/auth/**,/api/v2/auth/**,/api/v3/auth/**,/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: identityCircuitBreaker
                fallbackUri: forward:/fallback/identity
            - name: Retry
              args:
                retries: 3
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2

        # ── Resident Service ─────────────────────────────────────────
        - id: resident-service
          uri: ${RESIDENT_SERVICE_URL:http://resident-service:8080}
          predicates:
            - Path=/api/v1/resident/**,/api/v2/resident/**,/api/v3/resident/**
          filters:
            - name: CircuitBreaker
              args:
                name: defaultCircuitBreaker
                fallbackUri: forward:/fallback/default
            - name: Retry
              args:
                retries: 3
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2

        # ── Property Service ─────────────────────────────────────────
        - id: property-service
          uri: ${PROPERTY_SERVICE_URL:http://property-service:8080}
          predicates:
            - Path=/api/v1/property/**,/api/v2/property/**,/api/v3/property/**
          filters:
            - name: CircuitBreaker
              args:
                name: defaultCircuitBreaker
                fallbackUri: forward:/fallback/default
            - name: Retry
              args:
                retries: 3
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2

        # ── Finance Service ──────────────────────────────────────────
        - id: finance-service
          uri: ${FINANCE_SERVICE_URL:http://finance-service:8080}
          predicates:
            - Path=/api/v1/finance/**,/api/v2/finance/**,/api/v3/finance/**,/api/finance/**
          filters:
            - name: CircuitBreaker
              args:
                name: financeCircuitBreaker
                fallbackUri: forward:/fallback/finance
            - name: Retry
              args:
                retries: 2
                methods: GET
                backoff:
                  firstBackoff: 200ms
                  maxBackoff: 1000ms
                  factor: 2

        # ── Payment Service ──────────────────────────────────────────
        - id: payment-service
