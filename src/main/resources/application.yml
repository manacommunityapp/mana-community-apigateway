# ── JWT Configuration ──────────────────────────────────────────────────
gateway:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-for-signing-jwt-tokens-change-in-production}
    expiration: 86400000       # 24 hours
    refresh-expiration: 604800000  # 7 days
    issuer: mana-community

  # ── Public endpoints (no auth required) ────────────────────────────
  security:
    public-paths:
      - /api/v*/auth/login
      - /api/auth/login
      - /api/v*/auth/register
      - /api/auth/register
      - /api/v*/auth/forgot-password
      - /api/auth/forgot-password
      - /api/v*/auth/reset-password
      - /api/auth/reset-password
      - /api/v*/auth/verify-email
      - /api/auth/verify-email
      - /api/v*/auth/verify-otp
      - /api/auth/verify-otp
      - /api/otp/**
      - /api/v*/auth/refresh-token
      - /api/auth/refresh
      - /api/v*/auth/oauth2/**
      - /api/auth/oauth2/**
      - /api/v*/payment/webhooks/**
      - /api/v*/payments/webhooks/**
      - /api/payments/webhooks/**
      - /api/v*/notifications/webhooks/**
      - /api/notifications/webhooks/**
      - /actuator/health
      - /actuator/info
      - /actuator/prometheus
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /webjars/**
      - /fallback/**
      - /gateway/routes/**

  # ── Tenant Configuration ───────────────────────────────────────────
  tenant:
    header-name: X-Tenant-Id
    default-tenant: default
    supported-types:
      - APARTMENT
      - VILLA
      - SCHOOL
      - HOSPITAL
      - CORPORATE_PARK
      - COMMERCIAL_BUILDING
      - UNIVERSITY
      - SHOPPING_MALL

  # ── Rate Limiting ──────────────────────────────────────────────────
  rate-limit:
    enabled: true
    default-rate: 100
    default-duration: 60
    endpoints:
      "/api/v*/auth/login": "5,60"
      "/api/v*/auth/verify-otp": "3,60"
      "/api/v*/finance/payment/**": "20,60"
      "/api/v*/search/**": "100,60"
      "/api/v*/ai/**": "50,60"

# ── Resilience4j ───────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
    instances:
      identityCircuitBreaker:
        base-config: default
      financeCircuitBreaker:
        base-config: default
        failure-rate-threshold: 30
        wait-duration-in-open-state: 60s
      aiCircuitBreaker:
        base-config: default
        sliding-window-size: 5
        wait-duration-in-open-state: 45s
      defaultCircuitBreaker:
        base-config: default

  timelimiter:
    configs:
      default:
        timeout-duration: 10s
    instances:
      aiCircuitBreaker:
        timeout-duration: 30s
      financeCircuitBreaker:
        timeout-duration: 15s

  bulkhead:
    configs:
      default:
        max-concurrent-calls: 100
        max-wait-duration: 500ms
    instances:
      aiCircuitBreaker:
        max-concurrent-calls: 50

# ── Actuator ───────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,5s
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

# ── Logging ────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.manacommunity.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    io.lettuce: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] [%X{tenantId}] %-5level %logger{36} - %msg%n"


