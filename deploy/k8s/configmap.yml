apiVersion: v1
kind: ConfigMap
metadata:
  name: community-api-gateway-config
  namespace: mana-community
  labels:
    app: community-api-gateway
data:
  redis-host: "redis-cluster.mana-community.svc.cluster.local"
  redis-port: "6379"
  jwt-issuer-uri: "https://auth.manacommunity.com/realms/mana-community"
  cors-allowed-origins: "https://app.manacommunity.com,https://admin.manacommunity.com,https://vendor.manacommunity.com"
  tracing-sample-rate: "0.05"
