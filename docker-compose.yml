# ============================================================================
# Mana Community API Gateway — Docker Compose
# ============================================================================
# Start:   docker compose up -d
# Logs:    docker compose logs -f gateway
# Stop:    docker compose down
# ============================================================================

services:
  # ── API Gateway ─────────────────────────────────────────────────────
  gateway:
    build: .
    container_name: mana-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-ZGV2LXNlY3JldC1rZXktZm9yLW1hbmEtY29tbXVuaXR5LWFwaS1nYXRld2F5LWRvLW5vdC11c2UtaW4tcHJvZA==}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://keycloak:8180/realms/mana-community}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      RESIDENT_SERVICE_URL: http://resident-service:8082
      PROPERTY_SERVICE_URL: http://property-service:8083
      FINANCE_SERVICE_URL: http://finance-service:8084
      MARKETPLACE_SERVICE_URL: http://marketplace-service:8085
      FOOD_SERVICE_URL: http://food-service:8086
      HEALTHCARE_SERVICE_URL: http://healthcare-service:8087
      SPORTS_SERVICE_URL: http://sports-service:8088
      EVENTS_SERVICE_URL: http://events-service:8089
      SECURITY_SERVICE_URL: http://security-service:8090
      VISITOR_SERVICE_URL: http://visitor-service:8091
      BOOKING_SERVICE_URL: http://booking-service:8092
      NOTIFICATION_SERVICE_URL: http://notification-service:8093
      SEARCH_SERVICE_URL: http://search-service:8094
      ANALYTICS_SERVICE_URL: http://analytics-service:8095
      AI_SERVICE_URL: http://ai-service:8096
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mana-net

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mana-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mana-net

  # ── Prometheus ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: mana-gateway-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - mana-net

  # ── Grafana ─────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: mana-gateway-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - mana-net

volumes:
  redis-data:
  grafana-data:

networks:
  mana-net:
    driver: bridge
